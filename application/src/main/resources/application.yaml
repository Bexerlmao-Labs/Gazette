spring:
  application:
    name: gazette-press
  profiles:
    # 默认使用 dev，打包上线时用 --spring.profiles.active=prod 覆盖
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/gazette
    username: postgres
    password: postgres

server:
  port: 8080

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
